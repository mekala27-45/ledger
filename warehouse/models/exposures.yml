version: 2

# Every page of the site that reads a mart, declared so the lineage graph shows who depends on what.

exposures:
  - name: page_glance
    label: The bank at a glance (/)
    type: dashboard
    maturity: high
    owner: {name: Ajay Mekala}
    depends_on:
      - ref('mart_balance_sheet_monthly')
      - ref('mart_income_statement_monthly')
      - ref('mart_fdic_peer_quarter')
      - ref('mart_portfolio_monthly')
