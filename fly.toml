# Fly.io, free allowance: one shared CPU machine. The desk's replay worker runs inside the
# API process, so the machine must stay awake during a demo; see docs/runbook.md.
app = "ledger-harborline-api"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile.api"

[env]
  LEDGER_ENV = "production"
  LEDGER_REPLAY_SECONDS_PER_HOUR = "1.0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 50
    hard_limit = 100

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  path = "/v1/health"
  timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
