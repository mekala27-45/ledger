name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # The site reads the committed bundle in web/public/data. The live API, when one is
      # deployed, is named by the LEDGER_API_URL repository variable; without it the desk
      # plays its recorded replay and the studio scores in the browser.
      - run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: /ledger
          NEXT_PUBLIC_LEDGER_API: ${{ vars.LEDGER_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
