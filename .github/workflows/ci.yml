name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --frozen
      - name: Dash and vocabulary gates
        run: |
          uv run python scripts/check_no_em_dash.py
          uv run python scripts/check_vocabulary.py
      - name: Claim gate (documents re-rendered from the manifest and diffed)
        run: uv run python scripts/check_published_numbers.py
      - name: Statements on every document and report
        run: uv run python scripts/check_statements.py
      - name: Bank name re-verified against the FDIC directory
        run: uv run python scripts/check_bank_name.py
      - name: Identifier scan over everything published
        run: uv run python scripts/scan_for_planted_identifiers.py
      - name: Palette validator, both modes
        run: node scripts/validate_palette.js --config web/src/theme/palette.json

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ledger_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LEDGER_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ledger_test
      LEDGER_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # The parity tests run the site's TypeScript with node's type stripping.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --frozen
      - name: Tests with the coverage floor
        run: uv run pytest --cov --cov-report=term-missing:skip-covered --cov-report=xml
      - name: The five notebooks run on the committed results
        run: uv run pytest --nbmake notebooks -p no:cacheprovider

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Every route, both statements, table toggles, the recorded replay, phone layouts
        run: npx playwright test
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
        working-directory: .
      - name: Both statements on every built page, and the identifier scan over the built site
        working-directory: .
        run: |
          uv run python scripts/check_statements.py
          uv run python scripts/scan_for_planted_identifiers.py

  containers:
    # Both images build from a clean checkout, so the Fly deploy and a containerised pipeline
    # run are one command away. Nothing is pushed to a registry from CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The API image
        run: docker build -f Dockerfile.api -t ledger-api:ci .
      - name: The pipeline image
        run: docker build -f Dockerfile.pipeline -t ledger-pipeline:ci .
      - name: The API image imports its application
        run: docker run --rm --entrypoint python ledger-api:ci -c "import ledger_api.main; print('ok')"

