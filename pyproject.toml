[project]
name = "ledger"
version = "0.1.0"
description = "The analytics function of a fictional retail bank: credit, fraud, financial crime, fair lending, treasury and model risk"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Ajay Mekala" }]
dependencies = [
  "ledger-core",
  "ledger-render",
  "ledger-bankgen",
  "ledger-scan",
  "ledger-contracts",
  "ledger-scorecard",
  "ledger-fairness",
  "ledger-models",
  "ledger-desk",
  "ledger-crime",
  "ledger-nlp",
  "ledger-stress",
  "ledger-insights",
  "ledger-api",
  "ledger-functions",
  "typer>=0.15",
]

[project.scripts]
ledger = "ledger_functions.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "anyio>=4.6",
  "hypothesis>=6.120",
  "ruff>=0.11",
  "mypy>=1.15",
  "types-PyYAML",
  "types-openpyxl",
  "pandas-stubs",
  "nbmake>=1.5",
  "nbformat>=5.10",
  "nbconvert>=7.16",
  "ipykernel>=6.29",
  "matplotlib>=3.9",
  "pillow>=11",
]
warehouse = ["dbt-core>=1.10,<1.11", "dbt-duckdb>=1.9,<1.10"]
sparkov = ["faker==13.12.0"]

[tool.uv]
default-groups = ["dev", "warehouse"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ledger-core = { workspace = true }
ledger-render = { workspace = true }
ledger-bankgen = { workspace = true }
ledger-scan = { workspace = true }
ledger-contracts = { workspace = true }
ledger-scorecard = { workspace = true }
ledger-fairness = { workspace = true }
ledger-models = { workspace = true }
ledger-desk = { workspace = true }
ledger-crime = { workspace = true }
ledger-nlp = { workspace = true }
ledger-stress = { workspace = true }
ledger-insights = { workspace = true }
ledger-api = { workspace = true }
ledger-functions = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["web", "data", "results", "warehouse/target", "warehouse/dbt_packages", "notebooks", ".cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF100"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"notebooks/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/packages/api/src:$MYPY_CONFIG_FILE_DIR/packages/bankgen/src:$MYPY_CONFIG_FILE_DIR/packages/contracts/src:$MYPY_CONFIG_FILE_DIR/packages/core/src:$MYPY_CONFIG_FILE_DIR/packages/crime/src:$MYPY_CONFIG_FILE_DIR/packages/desk/src:$MYPY_CONFIG_FILE_DIR/packages/fairness/src:$MYPY_CONFIG_FILE_DIR/packages/functions/src:$MYPY_CONFIG_FILE_DIR/packages/insights/src:$MYPY_CONFIG_FILE_DIR/packages/models/src:$MYPY_CONFIG_FILE_DIR/packages/nlp/src:$MYPY_CONFIG_FILE_DIR/packages/render/src:$MYPY_CONFIG_FILE_DIR/packages/scan/src:$MYPY_CONFIG_FILE_DIR/packages/scorecard/src:$MYPY_CONFIG_FILE_DIR/packages/stress/src"
explicit_package_bases = true
files = ["packages/*/src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "postgres: needs a reachable Postgres (LEDGER_TEST_DATABASE_URL or local binaries)",
  "warehouse: needs the built DuckDB warehouse",
  "external: needs the real public datasets under data/external",
  "slow: full pipeline verification",
  "libreoffice: needs LibreOffice to recalculate the workbook",
  "airflow: needs Apache Airflow installed",
  "weights: needs locally available model weights",
  "java: needs a Java runtime",
]
filterwarnings = ["ignore::DeprecationWarning:dbt.*"]

[tool.coverage.run]
source = ["packages"]
omit = ["*/tests/*", "packages/functions/src/ledger_functions/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
