[project]
name = "ledger-desk"
version = "0.1.0"
description = "Fraud desk: point in time velocity features, rules, replay and late labels"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "polars>=1.30",
  "pyyaml>=6.0",
  "ledger-core",
  "ledger-models",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_desk"]

[tool.uv.sources]
ledger-core = { workspace = true }
ledger-models = { workspace = true }
