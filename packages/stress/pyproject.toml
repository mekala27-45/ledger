[project]
name = "ledger-stress"
version = "0.1.0"
description = "Rate shocks, the supervisory scenario link model and liquidity"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "numpy>=1.26",
  "statsmodels>=0.14",
  "polars>=1.30",
  "ledger-core",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_stress"]

[tool.uv.sources]
ledger-core = { workspace = true }
