[project]
name = "ledger-render"
version = "0.1.0"
description = "The claim gate: documents rendered from the manifest and diffed whole"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "jinja2>=3.1",
  "ledger-core",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_render"]

[tool.uv.sources]
ledger-core = { workspace = true }
