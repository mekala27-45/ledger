[project]
name = "ledger-api"
version = "0.1.0"
description = "FastAPI service: scoring, the desk stream, alerts, cases and audit"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "sqlmodel>=0.0.24",
  "psycopg[binary]>=3.2",
  "alembic>=1.15",
  "httpx>=0.28",
  "ledger-core",
  "ledger-scorecard",
  "ledger-desk",
  "ledger-models",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_api"]

[tool.uv.sources]
ledger-core = { workspace = true }
ledger-scorecard = { workspace = true }
ledger-desk = { workspace = true }
ledger-models = { workspace = true }
