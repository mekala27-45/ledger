[project]
name = "ledger-fairness"
version = "0.1.0"
description = "Subgroup metrics, disparity ratios and the BAF evaluation protocol"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.14",
  "statsmodels>=0.14",
  "polars>=1.30",
  "ledger-core",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_fairness"]

[tool.uv.sources]
ledger-core = { workspace = true }
