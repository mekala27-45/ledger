[project]
name = "ledger-scorecard"
version = "0.1.0"
description = "Weight of evidence scorecard engine: binning, WoE, IV, points, reason codes"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "numpy>=1.26",
  "polars>=1.30",
  "scipy>=1.14",
  "scikit-learn>=1.6",
  "pyyaml>=6.0",
  "ledger-core",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_scorecard"]

[tool.uv.sources]
ledger-core = { workspace = true }
