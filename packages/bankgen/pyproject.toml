[project]
name = "ledger-bankgen"
version = "0.1.0"
description = "Seeded core banking generator with known parameters and injected typologies"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "numpy>=1.26",
  "polars>=1.30",
  "ledger-core",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_bankgen"]

[tool.uv.sources]
ledger-core = { workspace = true }
