[project]
name = "ledger-scan"
version = "0.1.0"
description = "Planted identifier scan and the fictional bank name check"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "ledger-core",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_scan"]

[tool.uv.sources]
ledger-core = { workspace = true }
