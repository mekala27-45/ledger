[project]
name = "ledger-contracts"
version = "0.1.0"
description = "Pandera contracts for raw tables and marts, with quarantine by rule"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "pandera[polars]>=0.24",
  "polars>=1.30",
  "ledger-core",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_contracts"]

[tool.uv.sources]
ledger-core = { workspace = true }
